name: PayAssure keep-alive

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoke-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke the keep-alive endpoint
        run: >-
          curl
          --fail-with-body
          --silent
          --show-error
          --max-time 240
          https://service-keep-alive.onrender.com/api/keep-alive
